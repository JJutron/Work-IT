# SANZERO Docker Compose 설정

services:
  # Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: sanzero-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - nuxt
    restart: unless-stopped

  # Nuxt 홈 (`/` + `/_nuxt/`)
  nuxt:
    build: ./web
    container_name: sanzero-nuxt
    ports:
      - "3000:3000"
    environment:
      FASTAPI_INTERNAL_URL: http://web:8000
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.nuxt
    command: sh -c "npm install && npm run dev"
    depends_on:
      - web
    restart: unless-stopped

  # FastAPI 웹 애플리케이션
  web:
    build: .
    container_name: sanzero-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/__pycache__
    # 이미지 CMD는 workers=4 이라 볼륨의 .py가 안 바뀐다. 개발 마운트는 reload로 저장 로직을 반영한다.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - app
      - --reload-include
      - "*.py"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    driver: bridge