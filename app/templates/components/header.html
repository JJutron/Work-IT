<!-- SANZERO 헤더 — 컴프: 로고 / 중앙 내비 / 로그인 sharp -->
{% from "components/sanzero_mark.html" import icon as sanzero_icon %}
<header class="bg-surface border-b border-border sticky top-0 z-50" x-data="{ mobileMenuOpen: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="relative flex items-center h-16">
            <a href="/" class="flex items-center space-x-3 shrink-0 z-10 min-w-0">
                {{ sanzero_icon() }}
                <span class="flex flex-col justify-center min-w-0">
                    <span class="text-lg font-bold tracking-tight text-ink leading-none">SANZERO</span>
                    <span class="mt-1 text-[11px] text-muted tracking-tight leading-none whitespace-nowrap">산업재해 보상 서비스</span>
                </span>
            </a>

            <nav class="hidden md:flex absolute inset-x-0 justify-center items-center space-x-8" aria-label="주요 메뉴">
                <a href="/compensation/calculator" class="text-sm font-medium text-muted hover:text-ink transition-colors">보상금 계산기</a>
                <a href="/compensation/status" class="text-sm font-medium text-muted hover:text-ink transition-colors">보상 진행 현황</a>
                <a href="/analysis/precedent" class="text-sm font-medium text-muted hover:text-ink transition-colors">판례 분석</a>
            </nav>

            <div class="flex items-center space-x-3 ml-auto shrink-0 z-10">
                {% if current_user %}
                <div class="relative">
                    <button id="user-menu-button" onclick="toggleUserDropdown()" class="flex items-center space-x-3 text-sm rounded-full focus:outline-none focus:ring-2 focus:ring-ink focus:ring-offset-2">
                        <div class="w-8 h-8 bg-ink text-surface rounded-full flex items-center justify-center">
                            <span class="font-medium text-xs">{{ current_user.username[0].upper() }}</span>
                        </div>
                        <span class="hidden md:block text-ink font-medium">{{ current_user.username }}</span>
                        <svg class="w-4 h-4 text-muted" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                    <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-surface rounded-lg border border-border py-1 z-50">
                        <a href="/auth/profile" class="block px-4 py-2 text-sm text-ink hover:bg-surface">프로필 관리</a>
                        <hr class="my-1 border-border">
                        <button onclick="handleLogout(event)" class="block w-full text-left px-4 py-2 text-sm text-ink hover:bg-surface">로그아웃</button>
                    </div>
                </div>
                {% else %}
                <a href="/auth/login" class="bg-ink text-surface px-5 py-2 rounded-none text-sm font-medium hover:opacity-90 transition-opacity">로그인</a>
                {% endif %}

                <button type="button" class="md:hidden p-2 text-muted hover:text-ink rounded-md"
                        @click="mobileMenuOpen = !mobileMenuOpen"
                        :aria-expanded="mobileMenuOpen.toString()"
                        aria-controls="mobile-menu"
                        aria-label="메뉴 열기">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 7h16M4 12h16M4 17h16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <nav id="mobile-menu" class="md:hidden border-t border-border py-3 space-y-1" x-show="mobileMenuOpen" x-cloak>
            <a href="/compensation/calculator" class="block px-2 py-2 text-sm text-ink">보상금 계산기</a>
            <a href="/compensation/status" class="block px-2 py-2 text-sm text-ink">보상 진행 현황</a>
            <a href="/analysis/precedent" class="block px-2 py-2 text-sm text-ink">판례 분석</a>
        </nav>
    </div>
</header>

<script>
    function toggleUserDropdown() {
        const dropdown = document.getElementById('user-dropdown');
        dropdown.classList.toggle('hidden');
    }

    function closeUserDropdown() {
        const dropdown = document.getElementById('user-dropdown');
        if (dropdown) dropdown.classList.add('hidden');
    }

    function handleLogout(event) {
        event.preventDefault();
        if (confirm('정말 로그아웃 하시겠습니까?')) {
            closeUserDropdown();
            fetch('/auth/logout', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrf_token')
                }
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = '/auth/login';
                } else {
                    alert('로그아웃 중 오류가 발생했습니다.');
                }
            })
            .catch(() => alert('로그아웃 중 오류가 발생했습니다.'));
        }
    }

    document.addEventListener('click', function(event) {
        const dropdown = document.getElementById('user-dropdown');
        const button = document.getElementById('user-menu-button');
        if (dropdown && button && !button.contains(event.target) && !dropdown.contains(event.target)) {
            dropdown.classList.add('hidden');
        }
    });
</script>
