{# 계산 → 장해등급 → 판례 → 신청. claim_step: 1-4. 분석 내역은 다시 보기. #}
{% set step = claim_step | default(0) %}
<nav class="mb-8" aria-label="보상 신청 단계">
    <ol class="grid grid-cols-2 md:grid-cols-4 gap-2">
        <li>
            <a href="/compensation/calculator"
               class="flex items-center gap-2 min-h-11 px-3 py-2 rounded-xl border text-sm font-medium transition-colors duration-200 {% if step == 1 %}border-ink text-ink bg-surface{% elif step > 1 %}border-border bg-surface text-ink{% else %}border-border text-muted{% endif %}">
                <span class="font-mono text-xs tabular-nums w-5">01</span>
                <span>계산</span>
            </a>
        </li>
        <li>
            <a href="/analysis/disability"
               class="flex items-center gap-2 min-h-11 px-3 py-2 rounded-xl border text-sm font-medium leading-snug transition-colors duration-200 {% if step == 2 %}border-ink text-ink bg-surface{% elif step > 2 %}border-border bg-surface text-ink{% else %}border-border text-muted{% endif %}">
                <span class="font-mono text-xs tabular-nums w-5">02</span>
                <span>장해등급 예측</span>
            </a>
        </li>
        <li>
            <a href="/analysis/precedent"
               class="flex items-center gap-2 min-h-11 px-3 py-2 rounded-xl border text-sm font-medium transition-colors duration-200 {% if step == 3 %}border-ink text-ink bg-surface{% elif step > 3 %}border-border bg-surface text-ink{% else %}border-border text-muted{% endif %}">
                <span class="font-mono text-xs tabular-nums w-5">03</span>
                <span>판례</span>
            </a>
        </li>
        <li>
            <a href="/compensation/apply"
               class="flex items-center gap-2 min-h-11 px-3 py-2 rounded-xl border text-sm font-medium transition-colors duration-200 {% if step == 4 %}border-ink text-ink bg-surface{% else %}border-border text-muted{% endif %}">
                <span class="font-mono text-xs tabular-nums w-5">04</span>
                <span>신청서</span>
            </a>
        </li>
    </ol>
    <p class="sr-only">현재 단계 {{ step }} / 4</p>
</nav>
